<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="100%" height="80">
  <line x1="0" y1="68" x2="800" y2="68" stroke="#2e1065" stroke-width="2" stroke-dasharray="6 8"/>

  <g>
    <animateTransform attributeName="transform" type="translate" from="-100 0" to="830 0" dur="16s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="0.5s" repeatCount="indefinite"/>

      <!-- tail -->
      <path d="M10 38 Q-8 22 4 8" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-8 12 38;12 12 38;-8 12 38" dur="1s" repeatCount="indefinite"/>
      </path>

      <!-- back legs -->
      <rect x="14" y="46" width="7" height="20" rx="3.5" fill="#2e1065">
        <animateTransform attributeName="transform" type="rotate" values="-28 17.5 46;28 17.5 46;-28 17.5 46" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="26" y="46" width="7" height="20" rx="3.5" fill="#2e1065">
        <animateTransform attributeName="transform" type="rotate" values="28 29.5 46;-28 29.5 46;28 29.5 46" dur="0.8s" repeatCount="indefinite"/>
      </rect>

      <!-- body -->
      <ellipse cx="38" cy="40" rx="30" ry="14" fill="#8b5cf6"/>

      <!-- front legs -->
      <rect x="50" y="46" width="7" height="20" rx="3.5" fill="#2e1065">
        <animateTransform attributeName="transform" type="rotate" values="28 53.5 46;-28 53.5 46;28 53.5 46" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="60" y="46" width="7" height="20" rx="3.5" fill="#2e1065">
        <animateTransform attributeName="transform" type="rotate" values="-28 63.5 46;28 63.5 46;-28 63.5 46" dur="0.8s" repeatCount="indefinite"/>
      </rect>

      <!-- head -->
      <polygon points="63,21 66,6 74,17" fill="#8b5cf6"/>
      <polygon points="72,17 80,6 84,22" fill="#8b5cf6"/>
      <circle cx="73" cy="30" r="13" fill="#8b5cf6"/>
      <circle cx="77" cy="28" r="2.2" fill="#c4b5fd"/>
      <circle cx="69" cy="28" r="2.2" fill="#c4b5fd"/>
      <circle cx="82" cy="33" r="1.8" fill="#2e1065"/>
    </g>
  </g>
</svg>
