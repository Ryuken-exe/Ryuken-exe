import os

N = 6          # number of strips
T = 6          # seconds the cat takes to cross one strip
CYCLE = N * T

CAT = '''
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="0.5s" repeatCount="indefinite"/>
  <path d="M12 44 Q-8 32 6 12" fill="none" stroke="#a78bfa" stroke-width="7" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="-10 12 44;14 12 44;-10 12 44" dur="1s" repeatCount="indefinite"/>
  </path>
  <rect x="16" y="50" width="8" height="16" rx="4" fill="#a78bfa"><animateTransform attributeName="transform" type="rotate" values="-25 20 50;25 20 50;-25 20 50" dur="0.8s" repeatCount="indefinite"/></rect>
  <rect x="30" y="50" width="8" height="16" rx="4" fill="#a78bfa"><animateTransform attributeName="transform" type="rotate" values="25 34 50;-25 34 50;25 34 50" dur="0.8s" repeatCount="indefinite"/></rect>
  <ellipse cx="38" cy="44" rx="30" ry="17" fill="#c4b5fd"/>
  <ellipse cx="40" cy="52" rx="18" ry="8" fill="#ede9fe"/>
  <rect x="50" y="50" width="8" height="16" rx="4" fill="#a78bfa"><animateTransform attributeName="transform" type="rotate" values="25 54 50;-25 54 50;25 54 50" dur="0.8s" repeatCount="indefinite"/></rect>
  <rect x="62" y="50" width="8" height="16" rx="4" fill="#a78bfa"><animateTransform attributeName="transform" type="rotate" values="-25 66 50;25 66 50;-25 66 50" dur="0.8s" repeatCount="indefinite"/></rect>
  <polygon points="58,20 60,2 72,15" fill="#c4b5fd"/>
  <polygon points="72,15 84,2 87,22" fill="#c4b5fd"/>
  <polygon points="61,17 62,8 68,15" fill="#f9a8d4"/>
  <polygon points="76,15 82,8 83,18" fill="#f9a8d4"/>
  <circle cx="72" cy="32" r="18" fill="#c4b5fd"/>
  <circle cx="67" cy="31" r="3" fill="#2e1065"/><circle cx="78" cy="31" r="3" fill="#2e1065"/>
  <circle cx="68" cy="30" r="1" fill="#fff"/><circle cx="79" cy="30" r="1" fill="#fff"/>
  <ellipse cx="61" cy="38" rx="4" ry="2.5" fill="#f9a8d4" opacity="0.7"/>
  <ellipse cx="84" cy="38" rx="4" ry="2.5" fill="#f9a8d4" opacity="0.7"/>
  <polygon points="71,35 75,35 73,38" fill="#f472b6"/>
  <path d="M69 40 Q73 44 77 40" fill="none" stroke="#2e1065" stroke-width="1.2" stroke-linecap="round"/>
</g>
'''

os.makedirs("assets", exist_ok=True)

for i in range(N):
    a, b = i / N, (i + 1) / N
    going_right = (i % 2 == 0)
    start, end = (-100, 830) if going_right else (830, -100)
    flip = "" if going_right else ' transform="translate(90 0) scale(-1 1)"'
    svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="100%" height="80">
  <line x1="0" y1="68" x2="800" y2="68" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="{start} 0;{start} 0;{end} 0;{end} 0"
      keyTimes="0;{a:.4f};{b:.4f};1" dur="{CYCLE}s" repeatCount="indefinite"/>
    <g{flip}>{CAT}</g>
  </g>
</svg>'''
    with open(f"assets/cat-{i+1}.svg", "w", encoding="utf-8") as f:
        f.write(svg)

print("Done: assets/cat-1.svg ... cat-%d.svg" % N)
